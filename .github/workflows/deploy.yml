name: CI/CD for Dockerized Spring Boot App

on:
  push:
    branches:
      - main  # Run pipeline when code is pushed to main
      - wip
      - dev

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Spring Boot JARs
        run: mvn clean package -DskipTests

      - name: Debug JAR Generation
        run: |
          ls -lah runner/target/
          find . -name "*.jar"

      - name: Set up Docker Buildx (Multi-Platform)
        uses: docker/setup-buildx-action@v2

      - name: Authenticate with AWS ECR
        run: |
          aws configure set aws_access_key_id ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws configure set aws_secret_access_key ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws configure set region ${{ secrets.AWS_REGION }}
          aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com

      - name: Build and Push Docker Image to AWS ECR
        run: |
          ECR_REGISTRY=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com
          IMAGE_NAME=switch52
          docker buildx build --platform linux/amd64,linux/arm64 -t $ECR_REGISTRY/$IMAGE_NAME:latest --push .

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Set Environment Variables
        run: |
          echo "FIREBASE_AUTH_EMULATOR_HOST=127.0.0.1:9099" >> $GITHUB_ENV
          echo "GOOGLE_APPLICATION_CREDENTIALS=classpath:firebase/52switch_firebase_key.json" >> $GITHUB_ENV
          echo "MONGODB_URI=${{ secrets.MONGODB_URI }}" >> $GITHUB_ENV
          echo "MONGODB_DATABASE=${{ secrets.MONGODB_DATABASE }}" >> $GITHUB_ENV
          echo "HOLIDAY_API_KEY=${{ secrets.HOLIDAY_API_KEY }}" >> $GITHUB_ENV


      - name: Debug AWS ECR Access on EC2
        uses: appleboy/ssh-action@v0.1.4
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "Checking AWS CLI access..."
            aws sts get-caller-identity
            echo "Checking available Docker images on ECR..."
            aws ecr list-images --repository-name switch52 --region ${{ secrets.AWS_REGION }}

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.4
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "Logging into AWS ECR...."
            aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com

            echo "Pulling the latest Docker image..."
            docker pull ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/switch52:latest
            
            echo "Stopping and removing any existing container..."
            docker stop switch52-container || true
            docker rm switch52-container || true

            echo "Running the new container..."
            docker run -d -p 8080:8080 --name switch52-container \
              -e MONGODB_URI=${{ secrets.MONGODB_URI }} \
              -e MONGODB_DATABASE=${{ secrets.MONGODB_DATABASE }} \
              -e HOLIDAY_API_KEY=${{ secrets.HOLIDAY_API_KEY }} \
              ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/switch52:latest

      - name: Debug Running Containers
        uses: appleboy/ssh-action@v0.1.4
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "Listing running containers..."
            docker ps -a

      - name: Debug Container Logs
        uses: appleboy/ssh-action@v0.1.4
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "Checking logs of switch52-container..."
            docker logs switch52-container